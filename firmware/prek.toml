# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"

[[repos.hooks]]
id = "clang-format"
name = "clang-format"
entry = "clang-format -i"
language = "system"
types = ["c++"]

[[repos.hooks]]
id = "pio-check"
name = "pio check (clang-tidy + cppcheck)"
entry = "pio check --fail-on-defect=medium"
language = "system"
pass_filenames = false
always_run = true
