[platformio]
default_envs = esp32_wroom

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
check_tool = cppcheck, clangtidy
check_flags =
  clangtidy: --checks=-*,clang-analyzer-*,bugprone-*,modernize-*,performance-*,readability-*
check_skip_packages = yes

[env:esp32_wroom]
board = esp32dev
build_flags =
    -DBOARD_WROOM

[env:esp32_wroom_debug]
extends = env:esp32_wroom
build_flags =
    ${env:esp32_wroom.build_flags}
    -DCORE_DEBUG_LEVEL=3

[env:esp32_wrover]
board = esp32dev
board_build.flash_size = 8MB
build_flags =
    -DBOARD_WROVER
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:esp32_wrover_debug]
extends = env:esp32_wrover
build_flags =
    ${env:esp32_wrover.build_flags}
    -DCORE_DEBUG_LEVEL=3